version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: snake_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: snake_db
    ports:
      - "5434:5432"
    volumes:
      - snake_pgdata:/var/lib/postgresql/data

volumes:
  snake_pgdata:
